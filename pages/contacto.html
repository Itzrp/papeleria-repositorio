    <main>
        <section id="contact-us"> <!--CONTACTO-->
            <div class="contact-us">
                <div class="map-container"> <!--MAPA-->
                    <iframe class="map" src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d6327.818174179627!2d-99.1400534882768!3d19.432133384171845!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x85d1f92b75aa014d%3A0x17d810d20da6e8cf!2sPalacio%20de%20Bellas%20Artes!5e0!3m2!1ses!2smx!4v1754423810294!5m2!1ses!2smx" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
                    <div>
                        <img src="../assets/img/abierto.png" alt="servicios de impresión" class="logo-style">
                        <h3>Horario de atención</h3>
                    </div>
                    <p>Lunes a viernes 8:00 am - 8:00 pm</p>
                </div>
                <div class="form-style">
                    <div class="form-size">
                        <h2 class="text-center mb-4">Contacto</h2>
                        <form action="" method="post">
                            <div class="mb-4">
                                <label for="name" class="form-label">Nombre:</label>
                                <input type="text" class="form-control" id="name">
                            </div>

                            <div class="mb-4">
                                <label for="mail" class="form-label">Correo electrónico:</label>
                                <input type="email" class="form-control" id="mail">
                            </div>

                            <div class="mb-4">
                                <label for="phone" class="form-label">Teléfono:</label>
                                <input type="number" class="form-control" id="phone">
                            </div>

                            <div class="mb-4">
                                <label for="msj" class="form-label">Mensaje:</label>
                                <textarea class="form-control" id="name"></textarea>
                            </div>
                            <div class="d-flex justify-content-center">
                                <button type="submit" class="btn btn-primary button-style">Enviar</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </section>
